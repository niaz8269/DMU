;+Unmarked
; .user.ini — PHP per-directory config for DMU.
; NOTE: Honored only by CGI/FastCGI SAPIs, NOT by Apache mod_php (the current
; local stack), where it is silently ignored. session_config.php sets all of the
; session options below at RUNTIME, so this file is only a backstop for FastCGI
; hosts. Audit #18.
; Buffer output from the start so session cookies can always be sent.
output_buffering = 4096
; Session hardening. save_path and cookie_secure are intentionally NOT pinned
; here: session_config.php derives save_path from __DIR__ and only enables the
; Secure cookie flag over HTTPS — hardcoding an absolute iPage path or
; cookie_secure=1 here would break local HTTP and a moved deployment.
session.auto_start = 0
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_only_cookies = 1
session.cookie_lifetime = 0
session.gc_maxlifetime = 3600
session.use_strict_mode = 1
;-Unmarked

;+StackCP
asp_tags = 0
auto_append_file = 
auto_prepend_file = 
display_errors = 0
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
file_uploads = 1
post_max_size = 512M
max_execution_time = 300
max_input_vars = 2500
max_input_time = 60
max_file_uploads = 16
memory_limit = 512M
output_buffering = 0
short_open_tag = 1
upload_max_filesize = 512M
zlib.output_compression = 0
;-StackCP

